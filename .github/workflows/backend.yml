name: Backend Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Run golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend

  mocks:
    name: Check mocks are up to date
    runs-on: ubuntu-latest

    env:
      # Keep in sync with backend/.mockery.yml and the dev image.
      MOCKERY_VERSION: 3.8.1
      MOCKERY_SHA256: 953c7d38b58dd6398b1c595f27caf8bbf27e9b733b49c404d2e124e86d2ae72a

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install mockery
        run: |
          curl -sSfL -o /tmp/mockery.tar.gz \
            "https://github.com/vektra/mockery/releases/download/v${MOCKERY_VERSION}/mockery_${MOCKERY_VERSION}_Linux_x86_64.tar.gz"
          echo "${MOCKERY_SHA256}  /tmp/mockery.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mockery.tar.gz -C /tmp mockery

      - name: Regenerate mocks
        working-directory: backend
        run: /tmp/mockery

      - name: Fail if the mocks differ
        run: |
          if [ -n "$(git status --porcelain -- backend)" ]; then
            echo "Mocks are out of date: run mockery v${MOCKERY_VERSION} in backend/ and commit the result."
            git status --short -- backend
            git diff -- backend
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: macra
          POSTGRES_PASSWORD: macra
          POSTGRES_DB: macra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macra -d macra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway database of the CI service container; repo tests wipe it.
      PSQL_MACRA_TEST: postgres://macra:macra@localhost:5432/macra_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # -p 1: repo test packages share one database and migrate it up and
      # down around every test, so running them in parallel deadlocks.
      - name: Run tests
        working-directory: backend
        run: go test -count=1 -p 1 ./...
